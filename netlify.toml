# 2026-09-24: /quiz is retired in favour of the homepage quiz (/#quiz).
#
# /quiz is a prebuilt React app whose lead capture calls a tRPC backend at
# /api/trpc (leads.capturePartialLead, leads.submitToLofty). That backend does
# not exist on this static site -- and the page also loaded its JS/CSS from
# /assets/ while they live in /quiz/assets/. Even with the path fixed, a visitor
# would type their name, email and phone, get a score, and the lead would be
# silently dropped (the app catches the failed submit and shows the result
# anyway). The homepage quiz posts to the command-center receiver, which reaches
# Lofty, so every old /quiz link and search result goes there instead.
#
# force = true so the rule wins even if a file under /quiz/ ever comes back (the
# folder was deleted 2026-10-05; tests/retired.test.js keeps it out). This file
# only adds redirects; build and publish settings stay as configured in the Netlify UI.
[[redirects]]
  from = "/quiz"
  to = "/#quiz"
  status = 301
  force = true

[[redirects]]
  from = "/quiz/*"
  to = "/#quiz"
  status = 301
  force = true

# 2026-10-13: internal files are not published.
#
# Netlify publishes the repository root, so the project notes (README.md,
# CLAUDE.md), the tests, the scripts, the docs, the CI settings and this file
# could be fetched from owninnoco.com. These rules answer 404 for them and show
# /404.html; force = true makes the rule win over the existing file. The pages,
# /assets/, /data/ (the quiz reads /data/dpa-programs.json), robots.txt,
# sitemap.xml and llms.txt stay public. tests/publish-root.test.js fails if an
# internal file is not covered here or a public file is.
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.github/*"
  to = "/404.html"
  status = 404
  force = true
